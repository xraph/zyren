[package]
name = "flutter_gpu3d"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
glam = "0.33"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "wgsl"] }
