name: flutter_gpu3d
description: Flutter views for the native Dart 3D engine.
version: 0.1.0
publish_to: none
resolution: workspace
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'
dependencies:
  flutter:
    sdk: flutter
  gpu3d:
    path: ../gpu3d
  gpu3d_native:
    path: ../gpu3d_native
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  plugin:
    platforms:
      ios:
        pluginClass: Gpu3dPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: Gpu3dPlugin
        sharedDarwinSource: true
