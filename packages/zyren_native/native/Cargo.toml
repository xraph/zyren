[package]
name = "zyren_runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[build-dependencies]
cc = "1.2"

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
glam = "0.33"
crc32fast = "=1.5.2"
zune-core = "=0.5.3"
zune-jpeg = "=0.5.15"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
meshopt = "=0.6.2"
draco-core = { version = "=2.2.1", default-features = false, features = ["decoder", "edgebreaker_valence_decode", "legacy_bitstream_decode"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "wgsl"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6.4"
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLDevice", "MTLResource", "MTLTexture", "MTLPixelFormat", "MTLTypes", "MTLAllocation", "MTLCommandBuffer"] }

[target.'cfg(target_vendor = "apple")'.dev-dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFDictionary", "CFNumber", "CFString"] }
objc2-io-surface = { version = "0.3.2", default-features = false, features = ["std", "IOSurfaceRef", "objc2-core-foundation"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["objc2-io-surface", "MTLEvent", "MTLCommandBuffer", "MTLCommandQueue"] }

# Rust's debuginfo stripping can misalign Mach-O string tables on macOS 27.
# See https://github.com/rust-lang/rust/issues/157750.
[profile.release]
strip = "none"

[patch.crates-io]
wgpu-hal = { path = "vendor/wgpu-hal" }

[dev-dependencies]
draco-core = { version = "=2.2.1", default-features = false, features = ["encoder", "edgebreaker_valence_encode"] }
