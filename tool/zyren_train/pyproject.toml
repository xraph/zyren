[project]
name = "zyren-train"
version = "0.1.0"
description = "Train and export local policies for the Zyren game runtime."
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==2.3.4",
  "torch==2.8.0",
  "onnx==1.19.1",
  "onnxruntime==1.23.2",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
