name: Native physics Android x64
on:
  workflow_dispatch:
  push:
    paths: ['packages/zyren_physics/**', 'examples/physics_lab/**', '.github/workflows/physics-android.yml']
  pull_request:
    paths: ['packages/zyren_physics/**', 'examples/physics_lab/**', '.github/workflows/physics-android.yml']
jobs:
  android-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: flutter pub get
      - name: Enable emulator acceleration
        run: |
          test -c /dev/kvm
          sudo chown "$USER" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Vulkan app integration on Android x64
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader -feature Vulkan -camera-back none -camera-front none
          working-directory: examples/physics_lab
          script: flutter test integration_test/physics_lab_test.dart -d emulator-5554 --no-pub
