name: Native physics Android x64
on:
  workflow_dispatch:
  push:
    paths: ['packages/zyren_physics/**', 'examples/physics_lab/**', '.github/workflows/physics-android.yml']
  pull_request:
    paths: ['packages/zyren_physics/**', 'examples/physics_lab/**', '.github/workflows/physics-android.yml']
jobs:
  android-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Reserve space for the emulator and native builds
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / "$HOME"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: flutter pub get
      - name: Bound Gradle memory and compile the integration APK
        working-directory: examples/physics_lab
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'PROPERTIES'
          org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m
          org.gradle.workers.max=2
          org.gradle.daemon=false
          kotlin.compiler.execution.strategy=in-process
          PROPERTIES
          free -h
          flutter build apk --debug --target-platform android-x64 --target integration_test/physics_lab_test.dart --dart-define=INTEGRATION_TEST_SHOULD_REPORT_RESULTS_TO_NATIVE=false --no-pub
      - name: Enable emulator acceleration
        run: |
          test -c /dev/kvm
          sudo chown "$USER" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Vulkan app integration on Android x64
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          ram-size: 2048M
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -no-metrics -gpu swiftshader -feature Vulkan -skin 480x800 -camera-back none -camera-front none
          working-directory: examples/physics_lab
          script: flutter drive --driver=test_driver/qualification.dart --target=integration_test/physics_lab_test.dart --use-application-binary=build/app/outputs/flutter-apk/app-debug.apk -d emulator-5554 --no-pub
