name: Native physics
on:
  push:
    paths: ['packages/zyren_physics/**', 'examples/physics_lab/**', '.github/workflows/physics.yml']
  pull_request:
    paths: ['packages/zyren_physics/**', 'examples/physics_lab/**', '.github/workflows/physics.yml']
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - run: flutter pub get
      - run: dart analyze packages/zyren_physics examples/physics_lab
      - run: dart format --output=none --set-exit-if-changed packages/zyren_physics examples/physics_lab/lib examples/physics_lab/integration_test examples/physics_lab/tool
      - run: cargo +1.97.1 fmt --manifest-path packages/zyren_physics/native/Cargo.toml --check
      - run: cargo +1.97.1 clippy --manifest-path packages/zyren_physics/native/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo +1.97.1 test --manifest-path packages/zyren_physics/native/Cargo.toml --locked
      - run: dart test --concurrency=1
        working-directory: packages/zyren_physics
      - run: dart run tool/check_package_boundaries.dart
      - run: flutter build ${{ matrix.platform }} --debug
        working-directory: examples/physics_lab
  mobile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: flutter pub get
      - run: flutter build ios --simulator --debug --no-codesign
        working-directory: examples/physics_lab
      - run: flutter build apk --debug --target-platform android-arm64
        working-directory: examples/physics_lab
