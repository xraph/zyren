name: Native physics
on:
  workflow_dispatch:
    inputs:
      desktop_runner:
        description: Desktop runner to qualify, or all desktop and mobile builds
        type: choice
        default: all
        options:
          - all
          - macos-15
          - macos-15-intel
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
  push:
    paths: ['packages/zyren_physics/**', 'examples/physics_lab/**', '.github/workflows/physics.yml']
  pull_request:
    paths: ['packages/zyren_physics/**', 'examples/physics_lab/**', '.github/workflows/physics.yml']
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  desktop:
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      PHYSICS_PLATFORM: ${{ startsWith(matrix.os, 'macos') && 'macos' || startsWith(matrix.os, 'windows') && 'windows' || 'linux' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.desktop_runner && inputs.desktop_runner != 'all' && format('["{0}"]', inputs.desktop_runner) || '["macos-15", "macos-15-intel", "ubuntu-24.04", "ubuntu-24.04-arm", "windows-latest", "windows-11-arm"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        if: runner.arch != 'ARM64' || runner.os == 'macOS'
        with:
          flutter-version: '3.47.5'
          cache: true
      - name: Checkout Flutter source for arm64
        if: runner.arch == 'ARM64' && runner.os != 'macOS'
        uses: actions/checkout@v7
        with:
          repository: flutter/flutter
          ref: 6a19cca56475dbfba1478ee68d7bd0c2ef891da1
          path: .ci-flutter
          persist-credentials: false
      - name: Bootstrap Linux arm64 Flutter
        if: runner.arch == 'ARM64' && runner.os == 'Linux'
        shell: bash
        run: |
          git -C .ci-flutter checkout -B stable
          git -C .ci-flutter tag -f 3.47.5
          echo "$GITHUB_WORKSPACE/.ci-flutter/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=$GITHUB_WORKSPACE/.ci-flutter" >> "$GITHUB_ENV"
          .ci-flutter/bin/flutter --version
      - name: Bootstrap Windows arm64 Flutter
        if: runner.arch == 'ARM64' && runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') {
            throw 'Windows qualification requires a native ARM64 process.'
          }
          $flutterSdk = Join-Path $env:GITHUB_WORKSPACE '.ci-flutter'
          git -C $flutterSdk checkout -B stable
          git -C $flutterSdk tag -f 3.47.5
          (Join-Path $flutterSdk 'bin') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "FLUTTER_ROOT=$flutterSdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & (Join-Path $flutterSdk 'bin/flutter.bat') --version
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb xauth mesa-vulkan-drivers vulkan-tools
      # Rust lint and crate tests run in rust.yml; this toolchain builds the native asset.
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: flutter pub get
      - run: dart analyze packages/zyren_physics examples/physics_lab
      - run: dart format --output=none --set-exit-if-changed packages/zyren_physics examples/physics_lab/lib examples/physics_lab/integration_test examples/physics_lab/test_driver examples/physics_lab/tool
      - run: dart test --concurrency=1
        working-directory: packages/zyren_physics
      - run: dart run tool/check_package_boundaries.dart
      - run: flutter build ${{ env.PHYSICS_PLATFORM }} --debug
        working-directory: examples/physics_lab
      - name: Native render and cleanup
        run: dart run tool/qualify.dart qualification/ci
        working-directory: examples/physics_lab
      - name: Linux app integration
        if: runner.os == 'Linux'
        run: xvfb-run -a flutter test integration_test/physics_lab_test.dart -d linux --no-pub
        working-directory: examples/physics_lab
      - name: Desktop app integration
        if: runner.os != 'Linux'
        run: flutter test integration_test/physics_lab_test.dart -d ${{ env.PHYSICS_PLATFORM }} --no-pub
        working-directory: examples/physics_lab
      - name: Save render evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: physics-${{ matrix.os }}
          path: examples/physics_lab/qualification/ci/
  mobile:
    if: github.event_name != 'workflow_dispatch' || inputs.desktop_runner == 'all'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: flutter pub get
      - run: flutter build ios --simulator --debug --no-codesign
        working-directory: examples/physics_lab
      - run: flutter build apk --debug --target-platform android-arm64
        working-directory: examples/physics_lab
