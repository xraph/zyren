name: zyren_studio_example
description: Compact native Zyren scene editor.
version: 0.1.0+1
publish_to: none
resolution: workspace
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  zyren_geospatial:
    path: ../../packages/zyren_geospatial
  cupertino_icons: ^1.0.9
  flutter_zyren_studio:
    path: ../../packages/flutter_zyren_studio
  crypto: ^3.0.7
  zyren_gltf_timeline:
    path: ../../packages/zyren_gltf_timeline
  zyren_pipeline:
    path: ../../packages/zyren_pipeline
  file_selector: ^1.1.0
  zyren_collaboration:
    path: ../../packages/zyren_collaboration
  zyren_devtools:
    path: ../../packages/zyren_devtools
  zyren_agents:
    path: ../../packages/zyren_agents
  flutter:
    sdk: flutter
  flutter_zyren:
    path: ../../packages/flutter_zyren
  zyren_studio:
    path: ../../packages/zyren_studio
  zyren_inspector:
    path: ../../packages/zyren_inspector
  zyren_timeline:
    path: ../../packages/zyren_timeline
  zyren_tools:
    path: ../../packages/zyren_tools
  zyren_engineering:
    path: ../../packages/zyren_engineering
