name: model_viewer
description: Native glTF model loading through the public Dart API.
publish_to: none
version: 0.1.0+1
resolution: workspace
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  gpu3d:
    path: ../../packages/gpu3d
  gpu3d_native:
    path: ../../packages/gpu3d_native
  flutter:
    sdk: flutter
  flutter_gpu3d:
    path: ../../packages/flutter_gpu3d
  gpu3d_gltf:
    path: ../../packages/gpu3d_gltf
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/models/
